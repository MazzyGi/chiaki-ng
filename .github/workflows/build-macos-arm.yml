name: Build chiaki-ng macOSX arm64

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - mac-fixes
      - mac-1.9.9
    paths-ignore:
      - '**.md'
      - 'docs/**'

jobs:
  build-mac_arm64_github:
    name: Build macOSX arm64 version Github
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install protobuf
        run: |
          pip3 install --user 'protobuf>=5,<6' --break-system-packages
      - name: Install brew dependencies
        run: |
          brew update
          brew uninstall pkgconfig || true
          brew install --force qt@6 ffmpeg pkgconfig opus openssl cmake ninja nasm protobuf@29 speexdsp libplacebo wget python-setuptools json-c miniupnpc libevent

      - name: Configure chiaki-ng
        run: |
          cmake -S . -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCHIAKI_ENABLE_CLI=OFF -DCHIAKI_ENABLE_STEAMDECK_NATIVE=OFF -DCMAKE_PREFIX_PATH="$(brew --prefix)/opt/@openssl@3;$(brew --prefix)/opt/qt@6;$(brew --prefix)/opt/protobuf@29"

      - name: Build chiaki-ng
        run: |
          export CPATH=$(brew --prefix)/opt/ffmpeg/include
          cmake --build build --config Release --clean-first --target chiaki

      - name: Deploy chiaki-ng
        run: |
          rm -rf chiaki-ng.app chiaki-ng.dmg
          cp -a build/gui/chiaki.app chiaki-ng.app
          cp scripts/qtwebengine_import.qml gui/src/qml/
          $(brew --prefix)/opt/qt@6/bin/macdeployqt chiaki-ng.app -qmldir="$PWD/gui/src/qml" -libpath=$(brew --prefix)/lib
          mkdir -p chiaki-ng.app/Contents/Resources/vulkan/icd.d
          wget https://github.com/KhronosGroup/MoltenVK/releases/download/v1.2.9/MoltenVK-macos.tar && tar xf MoltenVK-macos.tar
          cp MoltenVK/MoltenVK/dylib/macOS/* chiaki-ng.app/Contents/Resources/vulkan/icd.d
          $(brew --prefix)/opt/qt@6/bin/macdeployqt chiaki-ng.app -qmldir="$PWD/gui/src/qml" -libpath=$(brew --prefix)/lib || true
          if [[ -d chiaki-ng.app/Contents/Frameworks/QtWebEngineCore.framework/Helpers/QtWebEngineProcess.app ]]
          then
            ln -s ../../../../../../../Frameworks chiaki-ng.app/Contents/Frameworks/QtWebEngineCore.framework/Helpers/QtWebEngineProcess.app/Contents
          fi
          # Deploy SDL2 from brew (name varies by version) into MacOS/
          BREW_LIB=$(brew --prefix)/lib
          # brew's sdl2 2.32+ is the sdl2-compat layer which requires SDL3 at
          # runtime -> bundle SDL3 alongside and point the compat layer at it.
          # sdl3 is keg-only in /opt/homebrew/opt/sdl3/lib - not in BREW_LIB
          SDL3_DYLIB=$(ls "$BREW_LIB"/libSDL3*.dylib /opt/homebrew/opt/sdl3/lib/libSDL3*.dylib 2>/dev/null | grep -v SDL3main | head -1 || true)
          if [ -n "$SDL3_DYLIB" ]; then
            # keep the exact SONAME (e.g. libSDL3.0.dylib) because sdl2-compat
            # dlopen()s it by that name at runtime
            SDL3_NAME=$(basename "$SDL3_DYLIB")
            cp "$SDL3_DYLIB" "chiaki-ng.app/Contents/MacOS/$SDL3_NAME"
            install_name_tool -id @executable_path/$SDL3_NAME "chiaki-ng.app/Contents/MacOS/$SDL3_NAME"
            install_name_tool -change "$SDL3_DYLIB" @executable_path/$SDL3_NAME chiaki-ng.app/Contents/MacOS/libSDL2-2.0.0.dylib 2>/dev/null || true
            install_name_tool -change @rpath/$SDL3_NAME @executable_path/$SDL3_NAME chiaki-ng.app/Contents/MacOS/libSDL2-2.0.0.dylib 2>/dev/null || true
            # also try launching the app headlessly to catch load errors
          fi
          SDL_DYLIB=$(ls "$BREW_LIB"/libSDL2-2*.dylib 2>/dev/null | head -1 || true)
          if [ -z "$SDL_DYLIB" ]; then
            SDL_DYLIB=$(ls "$BREW_LIB"/libSDL2*.dylib 2>/dev/null | grep -v SDL2main | head -1 || true)
          fi
          if [ -n "$SDL_DYLIB" ]; then
            cp "$SDL_DYLIB" chiaki-ng.app/Contents/MacOS/libSDL2-2.0.0.dylib
            install_name_tool -id @executable_path/libSDL2-2.0.0.dylib chiaki-ng.app/Contents/MacOS/libSDL2-2.0.0.dylib
            SDL_REF=$(otool -L chiaki-ng.app/Contents/MacOS/chiaki | grep -i sdl2 | awk '{print $1}' | head -1 || true)
            if [ -n "$SDL_REF" ]; then
              install_name_tool -change "$SDL_REF" @executable_path/libSDL2-2.0.0.dylib chiaki-ng.app/Contents/MacOS/chiaki || true
            fi
            install_name_tool -change "$SDL_DYLIB" @executable_path/libSDL2-2.0.0.dylib chiaki-ng.app/Contents/MacOS/chiaki || true
            install_name_tool -change @rpath/libSDL2-2.0.0.dylib @executable_path/libSDL2-2.0.0.dylib chiaki-ng.app/Contents/MacOS/chiaki || true
            install_name_tool -change /usr/local/lib/libSDL2-2.0.0.dylib @executable_path/libSDL2-2.0.0.dylib chiaki-ng.app/Contents/MacOS/chiaki || true
            install_name_tool -change /opt/homebrew/lib/libSDL2-2.0.0.dylib @executable_path/libSDL2-2.0.0.dylib chiaki-ng.app/Contents/MacOS/chiaki || true
          fi
          ln -s libvulkan.1.dylib chiaki-ng.app/Contents/Frameworks/vulkan || true
          codesign --force --entitlements gui/entitlements.xml --deep --sign - chiaki-ng.app
          rm -f chiaki-ng.dmg
          hdiutil create -srcfolder chiaki-ng.app chiaki-ng.dmg
          codesign --force --entitlements gui/entitlements.xml --deep --sign - chiaki-ng.dmg

      - name: Verify dynamic library resolution
        run: |
          echo "=== chiaki executable deps ==="
          otool -L chiaki-ng.app/Contents/MacOS/chiaki | sed 's/^/  /'
          echo "=== SDL dylibs present ==="
          ls -la chiaki-ng.app/Contents/MacOS/ | grep -i sdl || echo "  (none in MacOS/)"
          ls -la chiaki-ng.app/Contents/Frameworks/ | grep -i sdl || echo "  (none in Frameworks/)"
          # sdl2-compat hard-requires SDL3 at runtime
          if ! ls chiaki-ng.app/Contents/MacOS/libSDL3*.dylib >/dev/null 2>&1; then
            echo "FATAL: SDL3 not bundled - app will crash on user machines"
            exit 1
          fi
          echo "=== SDL2 compat layer deps ==="
          for f in chiaki-ng.app/Contents/MacOS/libSDL2*.dylib chiaki-ng.app/Contents/Frameworks/libSDL2*.dylib; do
            [ -f "$f" ] && otool -L "$f" | sed 's/^/  /'
          done
          echo "=== unresolved @rpath/@executable refs ==="
          BAD=0
          for ref in $(otool -L chiaki-ng.app/Contents/MacOS/chiaki | awk '{print $1}' | grep -E '^@rpath'); do
            name=$(basename "$ref")
            if ! ls chiaki-ng.app/Contents/MacOS/ chiaki-ng.app/Contents/Frameworks/ 2>/dev/null | grep -q "$name"; then
              echo "  MISSING: $ref"
              BAD=1
            fi
          done
          exit $BAD

      - name: Launch smoke test (dylib load)
        run: |
          # Run the binary in the background for 5s. If any dylib fails to
          # load (missing SDL3, bad install_name) the process dies instantly
          # with a non-zero exit. Hanging (GUI waiting) = libs loaded fine.
          set +e
          chiaki-ng.app/Contents/MacOS/chiaki > /tmp/smoke.log 2>&1 &
          SMOKE_PID=$!
          sleep 5
          if kill -0 $SMOKE_PID 2>/dev/null; then
            echo "still running after 5s -> dylib load OK"
            kill -9 $SMOKE_PID 2>/dev/null
          else
            wait $SMOKE_PID
            RC=$?
            echo "process died rc=$RC"
            head -20 /tmp/smoke.log
            [ $RC -eq 0 ] || exit 1
          fi

      - name: Upload chiaki-ng Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chiaki-ng-macos_arm64-Release
          path: chiaki-ng.dmg
          if-no-files-found: error
          retention-days: 7

      - name: Build summary
        run: |
          echo "## macOS arm64 build" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Ad-hoc signed (no Apple Developer certificate)." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 首次安装后去除 Gatekeeper 隔离（避免\"无法验证开发者\"弹窗）：" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "xattr -dr com.apple.quarantine /Applications/chiaki-ng.app" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
